<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roommate Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: 'Nunito Sans', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.08) 0, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,0.06) 0, transparent 45%),
        linear-gradient(160deg, #0F2E1D 0%, #1B4332 35%, #2D6A4F 65%, #40916C 100%);
      background-attachment: fixed;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: #F7FAF3;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(6,26,16,0.4);
      padding: 34px 30px 28px;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(64,145,108,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 25px;
      text-align: center;
      margin: 0 0 4px;
      color: #16351F;
      position: relative;
    }

    p.intro {
      text-align: center;
      font-size: 13px;
      color: #6E7C6F;
      margin: 0 0 22px;
      position: relative;
    }

    p.error {
      background: #FCEBE9;
      border: 1px solid #E9A9A2;
      color: #A93F32;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin: 0 0 18px;
      text-align: center;
      position: relative;
    }

    form { display: flex; flex-direction: column; gap: 12px; position: relative; }

    input, select {
      width: 100%;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      color: #223526;
      background: #E9F0E3;
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236E7C6F' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 38px;
    }

    input::placeholder { color: #93A392; }

    input:hover, select:hover { background: #E1EBD9; }

    input:focus, select:focus {
      border-color: #40916C;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(64,145,108,0.18);
    }

    input:disabled, select:disabled { opacity: 0.55; }

    button[type="submit"] {
      margin-top: 6px;
      width: 100%;
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 16px;
      color: #F7FAF3;
      background: linear-gradient(120deg, #40916C, #1B4332);
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(27,67,50,0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(27,67,50,0.42);
    }
    button[type="submit"]:active { transform: translateY(0); }

    p.admin-link {
      text-align: center;
      margin: 18px 0 0;
      font-size: 12px;
      position: relative;
    }
    p.admin-link a { color: #2D6A4F; text-decoration: none; font-weight: 700; }
    p.admin-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌳 Roommate Finder</h1>
    <p class="intro">Join a room and see who is already assigned to it.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('submit') }}" method="post" id="roommate-form">
      <input type="text" name="name" placeholder="Your name" maxlength="80" required autofocus>

      <select name="gender" id="gender" required>
        <option value="" selected disabled>Select gender</option>
        <option value="boys">Boys</option>
        <option value="girls">Girls</option>

      </select>

      <select name="hostel" id="hostel" required disabled>
        <option value="" selected disabled>Select gender first</option>
      </select>

      <input type="text" name="room" placeholder="Room number (e.g. 134)" maxlength="30" required>

      <select id="capacity-preset" required>
        <option value="" selected disabled>Room capacity</option>
        {% for size in capacity_presets %}
          <option value="{{ size }}">{{ size }} sharing</option>
        {% endfor %}
        <option value="custom">Custom</option>
      </select>

      <input type="number" id="custom-capacity" min="{{ min_capacity }}" max="{{ max_capacity }}"
             placeholder="Custom capacity (people)" style="display:none;">

      <input type="hidden" name="room_type" id="room_type_hidden">

      <input type="text" name="contact" placeholder="Instagram or phone" maxlength="120" required>

      <button type="submit">🌱 Find Roommate</button>
    </form>

    <p class="admin-link"><a href="{{ url_for('admin') }}">Admin panel</a></p>
  </main>

  <script>
    const hostelsByGender = {{ hostels | tojson }};
    const genderSelect = document.getElementById('gender');
    const hostelSelect = document.getElementById('hostel');

    genderSelect.addEventListener('change', function () {
      const hostels = hostelsByGender[this.value] || [];
      hostelSelect.innerHTML = '';
      hostelSelect.disabled = hostels.length === 0;

      const placeholderOpt = document.createElement('option');
      placeholderOpt.value = '';
      placeholderOpt.disabled = true;
      placeholderOpt.selected = true;
      placeholderOpt.textContent = hostels.length ? 'Select hostel' : 'Select gender first';
      hostelSelect.appendChild(placeholderOpt);

      hostels.forEach(function (name) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        hostelSelect.appendChild(opt);
      });
    });

    const presetSelect = document.getElementById('capacity-preset');
    const customInput = document.getElementById('custom-capacity');
    const hiddenInput = document.getElementById('room_type_hidden');
    const form = document.getElementById('roommate-form');

    presetSelect.addEventListener('change', function () {
      if (this.value === 'custom') {
        customInput.style.display = '';
        customInput.required = true;
        hiddenInput.value = '';
      } else {
        customInput.style.display = 'none';
        customInput.required = false;
        hiddenInput.value = this.value;
      }
    });

    form.addEventListener('submit', function () {
      if (presetSelect.value === 'custom') {
        hiddenInput.value = customInput.value;
      }
    });
  </script>
  <div class="footer" style="position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 14px; z-index: 10;">
    Do follow our instas: 
    <a href="https://instagram.com/v.rehansha" target="_blank" style="color: #ffffff; font-weight: bold; text-decoration: none;">@v.rehansha</a> & 
    <a href="https://www.instagram.com/karunyaram_1107" target="_blank" style="color: #ffffff; font-weight: bold; text-decoration: none;">@karunyaram_1107</a>
</div>
</body>
</html>
